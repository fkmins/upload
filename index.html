<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { background: #f1f5f9; }
    .card {
      background: #ffffff;
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
    }
    .drop-active {
      border-color: #2563eb !important;
      background-color: #eff6ff !important;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .bar-fill {
      background: linear-gradient(90deg, #2563eb 0%, #60a5fa 50%, #2563eb 100%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite linear;
      transition: width 0.2s ease-out;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">

  <div class="card w-full max-w-md rounded-2xl p-6 border border-slate-200">

    <div id="dropZone" class="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-xl p-10 text-center cursor-pointer bg-slate-50 transition-all">
      <input type="file" id="fileInput" class="hidden" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" />
      <svg class="w-10 h-10 text-slate-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
      </svg>
      <p class="text-sm font-semibold text-slate-700">CSV / XLSX</p>
      <p class="text-xs text-slate-400 mt-1">File Share</p>
    </div>

    <div id="processingState" class="hidden flex-col bg-slate-50 border border-slate-200 rounded-xl p-5">
      <div class="flex items-center justify-between mb-3">
        <span id="fileNameDisplay" class="text-xs font-bold text-slate-700 truncate max-w-[75%]"></span>
        <button onclick="cancelUpload()" class="text-xs font-semibold text-red-600 hover:underline">Cancel</button>
      </div>

      <div class="flex justify-between items-end mb-1.5">
        <span id="rowCounterText" class="text-xs font-medium text-slate-600"></span>
        <span id="percentText" class="text-lg font-extrabold text-blue-600">0%</span>
      </div>

      <div class="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
        <div id="progressBar" class="bar-fill h-full rounded-full" style="width: 0%"></div>
      </div>

      <div class="mt-3 flex justify-between text-[11px] text-slate-500 font-medium">
        <span id="batchCounterText"></span>
        <span id="etaText"></span>
      </div>
    </div>

    <div id="successState" class="hidden flex-col items-center justify-center bg-emerald-50 border border-emerald-200 rounded-xl p-6 text-center">
      <svg class="w-10 h-10 text-emerald-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
      </svg>
      <p id="successDetail" class="text-sm font-bold text-emerald-800"></p>
      <button onclick="resetUI()" class="mt-4 px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg">Upload Another</button>
    </div>

    <div id="errorAlert" class="hidden mt-3 p-3 bg-red-50 border border-red-200 rounded-xl flex items-center justify-between">
      <p id="errorText" class="text-xs text-red-700 font-medium break-words max-w-[82%]"></p>
      <button onclick="resetUI()" class="text-xs font-bold text-red-700 ml-2">Reset</button>
    </div>

  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzu1TFnZoMDIJo-f2pbNHnGY1DkF8EBuj6tx3dO4ulZSD2GJf-8Otgx3cw0Wgonueve/exec";

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const processingState = document.getElementById('processingState');
    const successState = document.getElementById('successState');
    const errorAlert = document.getElementById('errorAlert');
    const errorText = document.getElementById('errorText');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const rowCounterText = document.getElementById('rowCounterText');
    const percentText = document.getElementById('percentText');
    const progressBar = document.getElementById('progressBar');
    const batchCounterText = document.getElementById('batchCounterText');
    const etaText = document.getElementById('etaText');

    let abortController = null;
    let activeWorker = null;
    let isCancelled = false;

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drop-active'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drop-active'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drop-active');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function setProgress(percent, text) {
      const p = Math.min(100, Math.max(0, Math.round(percent)));
      progressBar.style.width = `${p}%`;
      percentText.innerText = `${p}%`;
      if (text) rowCounterText.innerText = text;
    }

    function cancelUpload() {
      isCancelled = true;
      if (abortController) abortController.abort();
      if (activeWorker) activeWorker.terminate();
      showError("Cancelled");
    }

    function colToLetter(col) {
      let s = '';
      while (col > 0) {
        let m = (col - 1) % 26;
        s = String.fromCharCode(65 + m) + s;
        col = Math.floor((col - m) / 26);
      }
      return s || 'A';
    }

    function parseFileInWorker(file, ext) {
      if (ext === '.csv') {
        return new Promise((resolve, reject) => {
          Papa.parse(file, {
            worker: true,
            skipEmptyLines: true,
            complete: (results) => resolve(results.data),
            error: (err) => reject(err)
          });
        });
      }

      return new Promise((resolve, reject) => {
        const workerCode = `
          importScripts('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
          self.onmessage = function(e) {
            try {
              const wb = XLSX.read(new Uint8Array(e.data), { type: 'array', dense: true });
              const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
              self.postMessage({ ok: true, rows: rows });
            } catch (err) {
              self.postMessage({ ok: false, error: err.message });
            }
          };
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        activeWorker = new Worker(URL.createObjectURL(blob));
        activeWorker.onmessage = (e) => {
          activeWorker.terminate();
          activeWorker = null;
          e.data.ok ? resolve(e.data.rows) : reject(new Error(e.data.error));
        };
        file.arrayBuffer().then(buf => activeWorker.postMessage(buf, [buf])).catch(reject);
      });
    }

    function initSession() {
      if (window.google && google.script && google.script.run) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(res => res && res.success ? resolve(res) : reject(new Error(res ? res.message : "Init failed")))
            .withFailureHandler(err => reject(new Error(err.message)))
            .initSheetSession();
        });
      }

      return fetch(WEB_APP_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: '{}'
      }).then(async res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        return data;
      }).catch(err => {
        throw new Error(`Handshake failed (${err.message}). Set Web App access to 'Anyone' or open via your Apps Script /exec link.`);
      });
    }

    async function handleFile(file) {
      isCancelled = false;
      errorAlert.classList.add('hidden');

      const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
      if (!['.csv', '.xlsx', '.xls'].includes(ext)) {
        showError("Upload a .CSV or .XLSX file.");
        return;
      }

      dropZone.classList.add('hidden');
      processingState.classList.remove('hidden');
      processingState.classList.add('flex');
      fileNameDisplay.innerText = file.name;
      batchCounterText.innerText = "";
      etaText.innerText = "";

      const startTime = performance.now();

      try {
        setProgress(4, "Parsing in background worker & authenticating...");
        const [rawMatrix, session] = await Promise.all([
          parseFileInWorker(file, ext),
          initSession()
        ]);
        if (isCancelled) return;

        const totalRows = rawMatrix.length;
        if (!totalRows) throw new Error("Empty file.");

        let maxCols = 1;
        for (let r = 0; r < totalRows; r++) {
          if (rawMatrix[r] && rawMatrix[r].length > maxCols) maxCols = rawMatrix[r].length;
        }

        const totalCells = totalRows * maxCols;
        if (totalCells > 10000000) {
          throw new Error(`File has ${totalCells.toLocaleString()} cells. Google Sheets limit is 10,000,000 cells.`);
        }

        const endCol = colToLetter(maxCols);
        const chunkSize = Math.max(2000, Math.min(35000, Math.floor(250000 / maxCols)));
        const totalChunks = Math.ceil(totalRows / chunkSize);
        const syncStart = performance.now();

        for (let i = 0; i < totalChunks; i++) {
          if (isCancelled) return;

          const startIdx = i * chunkSize;
          const endIdx = Math.min(startIdx + chunkSize, totalRows);
          const startRow = startIdx + 1;
          const batchNum = i + 1;

          batchCounterText.innerText = `Batch ${batchNum}/${totalChunks}`;
          setProgress(10 + ((i / totalChunks) * 90), `${startRow.toLocaleString()} – ${endIdx.toLocaleString()} of ${totalRows.toLocaleString()}`);

          const sliceLen = endIdx - startIdx;
          const chunkRows = new Array(sliceLen);
          for (let r = 0; r < sliceLen; r++) {
            const src = rawMatrix[startIdx + r] || [];
            const row = new Array(maxCols);
            for (let c = 0; c < maxCols; c++) {
              const v = src[c];
              row[c] = (v === null || v === undefined) ? "" : String(v);
            }
            chunkRows[r] = row;
          }

          const range = `${session.sheetName}!A${startRow}:${endCol}${endIdx}`;
          await putToSheetsApi(session.sheetId, range, session.token, chunkRows);

          const elapsed = (performance.now() - syncStart) / 1000;
          const rate = endIdx / elapsed;
          const rem = Math.ceil((totalRows - endIdx) / rate);
          etaText.innerText = rem > 0 ? `~${rem}s left (${Math.round(rate).toLocaleString()} rows/s)` : "";
        }

        setProgress(100, "Complete");
        const totalSec = ((performance.now() - startTime) / 1000).toFixed(1);
        showSuccess(`${totalRows.toLocaleString()} rows synced in ${totalSec}s`);

      } catch (err) {
        if (!isCancelled) showError(err.message);
      }
    }

    async function putToSheetsApi(sheetId, range, token, values) {
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${encodeURIComponent(range)}?valueInputOption=RAW`;
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          abortController = new AbortController();
          const res = await fetch(url, {
            method: 'PUT',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ majorDimension: 'ROWS', values: values }),
            signal: abortController.signal
          });

          if (!res.ok) {
            const errJson = await res.json().catch(() => ({}));
            throw new Error(errJson.error ? errJson.error.message : `HTTP ${res.status}`);
          }
          return;
        } catch (err) {
          if (isCancelled) throw err;
          if (attempt === 3) throw new Error(`Sheets API failed at ${range}: ${err.message}`);
          await new Promise(r => setTimeout(r, 1000 * attempt));
        }
      }
    }

    function showSuccess(msg) {
      processingState.classList.add('hidden');
      processingState.classList.remove('flex');
      successState.classList.remove('hidden');
      successState.classList.add('flex');
      document.getElementById('successDetail').innerText = msg;
      fileInput.value = '';
    }

    function showError(msg) {
      processingState.classList.add('hidden');
      processingState.classList.remove('flex');
      dropZone.classList.remove('hidden');
      errorText.innerText = msg;
      errorAlert.classList.remove('hidden');
      fileInput.value = '';
    }

    function resetUI() {
      successState.classList.add('hidden');
      successState.classList.remove('flex');
      errorAlert.classList.add('hidden');
      dropZone.classList.remove('hidden');
    }
  </script>
</body>
</html>

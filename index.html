<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Uploader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { background: #f1f5f9; }
    .card {
      background: #ffffff;
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
    }
    .drop-active {
      border-color: #2563eb !important;
      background-color: #eff6ff !important;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .bar-fill {
      background: linear-gradient(90deg, #2563eb 0%, #60a5fa 50%, #2563eb 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
      transition: width 0.25s ease;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">

  <div class="card w-full max-w-md rounded-2xl p-6 border border-slate-200">

    <div id="dropZone" class="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-xl p-10 text-center cursor-pointer bg-slate-50 transition-all">
      <input type="file" id="fileInput" class="hidden" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" />
      <svg class="w-10 h-10 text-slate-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
      </svg>
      <p class="text-sm font-medium text-slate-600">Click or drop CSV / XLSX</p>
    </div>

    <div id="processingState" class="hidden flex-col bg-slate-50 border border-slate-200 rounded-xl p-5">
      <div class="flex items-center justify-between mb-3">
        <span id="fileNameDisplay" class="text-xs font-bold text-slate-700 truncate max-w-[75%]"></span>
        <button onclick="cancelUpload()" class="text-xs font-semibold text-red-600 hover:underline">Cancel</button>
      </div>

      <div class="flex justify-between items-end mb-1.5">
        <span id="rowCounterText" class="text-xs font-medium text-slate-600"></span>
        <span id="percentText" class="text-lg font-extrabold text-blue-600">0%</span>
      </div>

      <div class="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
        <div id="progressBar" class="bar-fill h-full rounded-full" style="width: 0%"></div>
      </div>

      <div class="mt-3 flex justify-between text-[11px] text-slate-500 font-medium">
        <span id="batchCounterText"></span>
        <span id="etaText"></span>
      </div>
    </div>

    <div id="successState" class="hidden flex-col items-center justify-center bg-emerald-50 border border-emerald-200 rounded-xl p-6 text-center">
      <svg class="w-10 h-10 text-emerald-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
      </svg>
      <p id="successDetail" class="text-sm font-bold text-emerald-800"></p>
      <button onclick="resetUI()" class="mt-4 px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg">Upload Another</button>
    </div>

    <div id="errorAlert" class="hidden mt-3 p-3 bg-red-50 border border-red-200 rounded-xl flex items-center justify-between">
      <p id="errorText" class="text-xs text-red-700 font-medium break-words max-w-[80%]"></p>
      <button onclick="resetUI()" class="text-xs font-bold text-red-700 ml-2">Reset</button>
    </div>

  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzu1TFnZoMDIJo-f2pbNHnGY1DkF8EBuj6tx3dO4ulZSD2GJf-8Otgx3cw0Wgonueve/exec";

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const processingState = document.getElementById('processingState');
    const successState = document.getElementById('successState');
    const errorAlert = document.getElementById('errorAlert');
    const errorText = document.getElementById('errorText');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const rowCounterText = document.getElementById('rowCounterText');
    const percentText = document.getElementById('percentText');
    const progressBar = document.getElementById('progressBar');
    const batchCounterText = document.getElementById('batchCounterText');
    const etaText = document.getElementById('etaText');

    let abortController = null;
    let isCancelled = false;

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drop-active'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drop-active'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drop-active');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    const nextFrame = () => new Promise(res => requestAnimationFrame(() => setTimeout(res, 15)));

    function setProgress(percent, text) {
      const p = Math.min(100, Math.max(0, Math.round(percent)));
      progressBar.style.width = `${p}%`;
      percentText.innerText = `${p}%`;
      if (text) rowCounterText.innerText = text;
    }

    function cancelUpload() {
      isCancelled = true;
      if (abortController) abortController.abort();
      showError("Cancelled");
    }

    async function handleFile(file) {
      isCancelled = false;
      errorAlert.classList.add('hidden');

      const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
      if (!['.csv', '.xlsx', '.xls'].includes(ext)) {
        showError("Upload a .CSV or .XLSX file.");
        return;
      }

      dropZone.classList.add('hidden');
      processingState.classList.remove('hidden');
      processingState.classList.add('flex');
      fileNameDisplay.innerText = file.name;
      batchCounterText.innerText = "";
      etaText.innerText = "";

      const startTime = performance.now();

      try {
        setProgress(5, "Reading file...");
        const buffer = await file.arrayBuffer();
        if (isCancelled) return;

        setProgress(10, "Parsing spreadsheet...");
        await nextFrame();

        const workbook = XLSX.read(new Uint8Array(buffer), { type: 'array', dense: true });
        const rawMatrix = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: "" });

        const totalRows = rawMatrix.length;
        if (!totalRows) throw new Error("Empty file.");

        let maxCols = 1;
        for (let r = 0; r < totalRows; r++) {
          if (rawMatrix[r].length > maxCols) maxCols = rawMatrix[r].length;
        }

        setProgress(15, `Preparing ${totalRows.toLocaleString()} rows...`);
        await nextFrame();

        const normalized = new Array(totalRows);
        for (let r = 0; r < totalRows; r++) {
          const row = rawMatrix[r];
          const clean = new Array(maxCols);
          for (let c = 0; c < maxCols; c++) {
            const val = row[c];
            clean[c] = (val === null || val === undefined) ? "" : String(val);
          }
          normalized[r] = clean;
        }

        const chunkSize = Math.max(500, Math.min(4000, Math.floor(40000 / maxCols)));
        const totalChunks = Math.ceil(totalRows / chunkSize);
        const syncStart = performance.now();

        for (let i = 0; i < totalChunks; i++) {
          if (isCancelled) return;

          const startIdx = i * chunkSize;
          const endIdx = Math.min(startIdx + chunkSize, totalRows);
          const batchNum = i + 1;

          batchCounterText.innerText = `Part ${batchNum}/${totalChunks}`;
          setProgress(15 + ((i / totalChunks) * 85), `${(startIdx + 1).toLocaleString()} – ${endIdx.toLocaleString()} of ${totalRows.toLocaleString()}`);

          await sendChunk({
            rows: normalized.slice(startIdx, endIdx),
            startRow: startIdx + 1,
            totalRows: totalRows,
            maxCols: maxCols,
            isFirstChunk: i === 0,
            isLastChunk: batchNum === totalChunks
          });

          const elapsed = (performance.now() - syncStart) / 1000;
          const rate = endIdx / elapsed;
          const rem = Math.ceil((totalRows - endIdx) / rate);
          etaText.innerText = rem > 0 ? `~${rem}s left` : "";
        }

        setProgress(100, "Complete");
        const totalSec = ((performance.now() - startTime) / 1000).toFixed(1);
        showSuccess(`${totalRows.toLocaleString()} rows synced in ${totalSec}s`);

      } catch (err) {
        if (!isCancelled) showError(err.message);
      }
    }

    async function sendChunk(payload) {
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          abortController = new AbortController();
          const res = await fetch(WEB_APP_URL, {
            method: 'POST',
            redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
            signal: abortController.signal
          });

          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const result = await res.json();
          if (!result.success) throw new Error(result.message);
          return;
        } catch (err) {
          if (isCancelled) throw err;
          if (attempt === 3) throw new Error(`Row ${payload.startRow} failed (${err.message})`);
          await new Promise(r => setTimeout(r, 1000 * attempt));
        }
      }
    }

    function showSuccess(msg) {
      processingState.classList.add('hidden');
      processingState.classList.remove('flex');
      successState.classList.remove('hidden');
      successState.classList.add('flex');
      document.getElementById('successDetail').innerText = msg;
      fileInput.value = '';
    }

    function showError(msg) {
      processingState.classList.add('hidden');
      processingState.classList.remove('flex');
      dropZone.classList.remove('hidden');
      errorText.innerText = msg;
      errorAlert.classList.remove('hidden');
      fileInput.value = '';
    }

    function resetUI() {
      successState.classList.add('hidden');
      successState.classList.remove('flex');
      errorAlert.classList.add('hidden');
      dropZone.classList.remove('hidden');
    }
  </script>
</body>
</html>
